server {
    listen 443 ssl;
    ssl_certificate     /https/ocrweb-devcert.pem;
    ssl_certificate_key /https/ocrweb-devcert.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy backend routes to the api container (HTTP, internal Docker network)
    location /bff/ {
        proxy_pass         http://api:8080/bff/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # Angular SPA — any path not matching a real file falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
