<div class="split-row">
  <div class="split-row__drag" cdkDragHandle aria-label="Drag to reorder">
    <span class="split-row__drag-dots">
      <span></span><span></span>
      <span></span><span></span>
      <span></span><span></span>
    </span>
  </div>

  <span class="split-row__index">{{ index() + 1 }}</span>

  <div class="split-row__check">
    <mat-checkbox [checked]="split().selected" (change)="onSelectedChange($event.checked)" />
  </div>

  <span class="split-row__bookmark-name">{{ split().bookmarkName }}</span>

  <div class="split-row__preview">
    <app-pdf-preview
      [pdfDoc]="pdfDoc()"
      [fromPage]="split().fromPage"
      [toPage]="split().toPage"
    />
  </div>

  <div class="split-row__range">
    <input
      class="split-row__page-input"
      type="number"
      [value]="split().fromPage"
      [min]="1"
      [max]="totalPages()"
      (change)="onFromPageChange($event)"
      aria-label="From page"
    />
    <span class="split-row__range-sep">–</span>
    <input
      class="split-row__page-input"
      type="number"
      [value]="split().toPage"
      [min]="1"
      [max]="totalPages()"
      (change)="onToPageChange($event)"
      aria-label="To page"
    />
  </div>

  <div class="split-row__name">
    <input
      class="split-row__name-input"
      type="text"
      [value]="split().name"
      (change)="onNameChange($event)"
      aria-label="Split name"
    />
  </div>

  <div class="split-row__actions">
    <lib-menu
      [ariaLabel]="i18n.labels().split.splitRowActions"
      [items]="menuItems()"
      (itemSelected)="onMenuAction($event)"
    />
  </div>
</div>
