<form class="add-project" [formGroup]="form" (ngSubmit)="submit()">
  <lib-button [label]="i18n.labels().common.back" (clicked)="back()" />

  <h1>{{ i18n.labels().project.addProject }}</h1>

  <lib-text-input
    [control]="form.controls.name"
    [label]="i18n.labels().project.projectName"
    [errorText]="i18n.messages().project.nameRequired"
  />

  <label class="add-project__file-label" for="pdfFile">{{ i18n.labels().project.uploadPdf }}</label>
  <input id="pdfFile" class="add-project__file-input" type="file" accept="application/pdf" (change)="onFileSelected($event)" />
  @if (fileTouched() && !selectedFile()) {
    <p class="add-project__error">{{ i18n.messages().project.pdfRequired }}</p>
  }

  @if (errorText()) {
    <p class="add-project__error">{{ errorText() }}</p>
  }

  <lib-button
    [label]="submitting() ? i18n.labels().project.creatingButton : i18n.labels().project.createButton"
    variant="primary"
    type="submit"
    [disabled]="form.invalid || submitting()"
  />
</form>
